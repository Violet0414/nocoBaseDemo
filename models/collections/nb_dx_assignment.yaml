name: nb_dx_assignment
title: 作业
titleField: name
fields:
  - name: name
    title: 作业名称
    interface: input
    required: true
  - name: klass
    title: 班次
    interface: m2o
    target: nb_dx_class
    foreignKey: class_id
  - name: topic
    title: 关联专题
    interface: m2o
    target: nb_dx_topic
    foreignKey: topic_id
  - name: teacher
    title: 布置教师
    interface: m2o
    target: users
    foreignKey: teacher_id
  - name: requirement
    title: 作业要求
    interface: textarea
  - name: due_date
    title: 提交截止时间
    interface: datetime
  - name: review_mode
    title: 批阅方式
    interface: select
    options:
      - value: teacher
        label: 教师批阅
        color: blue
      - value: peer
        label: 学员互评
        color: cyan
  - name: status
    title: 状态
    interface: select
    options:
      - value: assigned
        label: 已布置
        color: blue
      - value: closed
        label: 已截止
        color: orange
      - value: reviewed
        label: 已批阅完成
        color: green
  - name: submissions
    title: 学员提交
    interface: o2m
    target: nb_dx_submission
    foreignKey: assignment_id
