name: nb_dx_textbook_return
title: 教材退库
titleField: textbook_name
fields:
  - name: textbook_name
    title: 教材名称
    interface: input
  - name: textbook
    title: 教材
    interface: m2o
    target: nb_dx_textbook
    foreignKey: textbook_id
  - name: klass
    title: 退库班级
    interface: m2o
    target: nb_dx_class
    foreignKey: class_id
  - name: requisition
    title: 关联领用单
    interface: m2o
    target: nb_dx_requisition
    foreignKey: requisition_id
  - name: quantity
    title: 退库数量
    interface: number
    required: true
  - name: date
    title: 退库日期
    interface: date
  - name: operator
    title: 经办人
    interface: m2o
    target: users
    foreignKey: operator_id
