name: nb_dx_commitment
title: 纪律承诺
titleField: title
fields:
  - name: title
    title: 承诺书标题
    interface: input
    required: true
  - name: klass
    title: 班次
    interface: m2o
    target: nb_dx_class
    foreignKey: class_id
  - name: student
    title: 签署学员
    interface: m2o
    target: nb_dx_student
    foreignKey: student_id
  - name: content
    title: 承诺书内容
    interface: textarea
  - name: signed
    title: 已签名
    interface: boolean
  - name: signed_at
    title: 签名时间
    interface: datetime
  - name: signature_img
    title: 手写签名
    interface: attachment
