name: nb_dx_requisition
title: 教材领用
titleField: textbook_name
fields:
  - name: textbook_name
    title: 教材名称
    interface: input
  - name: textbook
    title: 教材
    interface: m2o
    target: nb_dx_textbook
    foreignKey: textbook_id
  - name: klass
    title: 领用班级
    interface: m2o
    target: nb_dx_class
    foreignKey: class_id
  - name: batch_no
    title: 领用批次
    interface: input
  - name: quantity
    title: 领用数量
    interface: number
    required: true
  - name: date
    title: 领用日期
    interface: date
  - name: status
    title: 状态
    interface: select
    options:
      - value: submitted
        label: 已提交
        color: blue
      - value: done
        label: 已领用
        color: green
      - value: cancelled
        label: 已取消
        color: gray
  - name: operator
    title: 经办人
    interface: m2o
    target: users
    foreignKey: operator_id
