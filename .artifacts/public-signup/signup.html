<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>班次报名</title>
<style>
  :root { --primary:#1677ff; --bg:#f5f6fa; --line:#e5e6eb; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:#1d2129; font-size:15px; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:19px; text-align:center; padding:16px 0 4px; }
  .klass-card { background:#e8f1ff; border:1px solid #bcd6ff; border-radius:10px; padding:12px 14px; margin:12px 0 4px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .klass-name { font-weight:600; color:#0e42d2; flex:1; }
  .klass-status { font-size:12px; color:#0e42d2; background:#ffffff; border-radius:99px; padding:2px 10px; white-space:nowrap; }
  .form-card { background:#fff; border-radius:12px; padding:8px 16px 16px; margin-top:14px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .field { padding:12px 0 4px; }
  .field label { display:block; font-size:13px; color:#4e5969; margin-bottom:6px; }
  .field label .req { color:#f53f3f; margin-left:2px; }
  .field input, .field select, .field textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:15px; outline:none; background:#fff; color:#1d2129; }
  .field textarea { min-height:80px; resize:vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--primary); }
  .btn { display:block; width:100%; margin-top:18px; padding:13px 0; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; }
  .btn:disabled { opacity:.55; }
  .msg { text-align:center; font-size:13px; margin-top:10px; min-height:18px; color:#f53f3f; }
  .ok-view { display:none; text-align:center; background:#fff; border-radius:12px; padding:40px 24px; margin-top:20px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .ok-view .icon { font-size:52px; }
  .ok-view h2 { font-size:18px; margin:12px 0 8px; }
  .ok-view p { color:#86909c; font-size:14px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>班次报名</h1>
  <div id="view-form">
    <div class="klass-card">
      <span class="klass-name" id="klass-name">班次信息加载中…</span>
      <span class="klass-status" id="klass-status"></span>
    </div>
    <div class="form-card">
      <div class="field"><label>姓名<span class="req">*</span></label><input id="f-name" placeholder="请输入姓名"></div>
      <div class="field"><label>手机号<span class="req">*</span></label><input id="f-phone" type="tel" inputmode="numeric" placeholder="请输入手机号"></div>
      <div class="field"><label>性别<span class="req">*</span></label>
        <select id="f-gender">
          <option value="">请选择</option>
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div class="field"><label>政治面貌<span class="req">*</span></label>
        <select id="f-political">
          <option value="">请选择</option>
          <option value="cpc">中共党员</option>
          <option value="league">共青团员</option>
          <option value="masses">群众</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="field"><label>单位及职务</label><input id="f-unit" placeholder="请输入工作单位及职务"></div>
      <div class="field"><label>报名附言</label><textarea id="f-note" placeholder="其他需要说明的信息（选填）"></textarea></div>
      <button class="btn" id="btn-submit">提 交 报 名</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div class="ok-view" id="view-ok">
    <div class="icon">✅</div>
    <h2>报名提交成功</h2>
    <p id="ok-text">教务老师审核后将与你联系。<br>请留意短信或电话通知。</p>
  </div>
</div>
<script>
(function(){
  var API_KEY = "__API_KEY_PLACEHOLDER__（部署时注入，真实 key 见 backups/public-signup-api-key.txt）";
  var qs = new URLSearchParams(location.search);
  var klassId = qs.get("class");
  var $ = function(id){ return document.getElementById(id); };
  var STATUS_TEXT = { enrollable:"报名中", ongoing:"进行中", planned:"计划中", finished:"已结束" };

  function showError(t){ $("msg").textContent = t; }
  function require(v,t){ if(!v){ showError(t); return false; } return true; }

  function loadKlass(){
    if(!klassId){ $("klass-name").textContent = "报名链接无效（缺少班次）"; return; }
    fetch("/api/nb_dx_class:get?filterByTk=" + encodeURIComponent(klassId) + "&fields=id,name,code,status,start_date,end_date", {
      headers: { "Authorization": "Bearer " + API_KEY, "X-Authenticator": "basic" }
    }).then(function(r){ return r.json(); }).then(function(d){
      var k = d && d.data;
      if(!k){ $("klass-name").textContent = "班次不存在或已下架"; return; }
      $("klass-name").textContent = k.name + (k.code ? "（" + k.code + "）" : "");
      $("klass-status").textContent = STATUS_TEXT[k.status] || "";
    }).catch(function(){ $("klass-name").textContent = "班次信息加载失败，请重进"; });
  }

  $("btn-submit").addEventListener("click", function(){
    showError("");
    var name = $("f-name").value.trim();
    var phone = $("f-phone").value.trim();
    var gender = $("f-gender").value;
    var political = $("f-political").value;
    if(!require(klassId, "报名链接无效（缺少班次）")) return;
    if(!require(name, "请填写姓名")) return;
    if(!require(phone, "请填写手机号")) return;
    if(!require(gender, "请选择性别")) return;
    if(!require(political, "请选择政治面貌")) return;
    var btn = $("btn-submit");
    btn.disabled = true; btn.textContent = "提交中…";
    fetch("/api/nb_dx_registration:create", {
      method: "POST",
      headers: { "Authorization": "Bearer " + API_KEY, "X-Authenticator": "basic", "Content-Type": "application/json" },
      body: JSON.stringify({
        class_id: Number(klassId),
        status: "pending",
        name: name,
        phone: phone,
        gender: gender,
        political_status: political,
        work_unit: $("f-unit").value.trim() || null,
        note: $("f-note").value.trim() || null
      })
    }).then(function(r){ return r.json().then(function(d){ return { status: r.status, d: d }; }); })
      .then(function(res){
        if(res.status === 200 || res.status === 201){
          $("view-form").style.display = "none";
          var ok = $("view-ok"); ok.style.display = "block";
          ok.scrollIntoView();
        } else {
          var msg = (res.d && res.d.errors && res.d.errors[0] && res.d.errors[0].message) || "提交失败，请重试";
          showError(msg);
          btn.disabled = false; btn.textContent = "提 交 报 名";
        }
      })
      .catch(function(){ showError("网络异常，请检查网络后重试"); btn.disabled = false; btn.textContent = "提 交 报 名"; });
  });

  loadKlass();
})();
</script>
</body>
</html>
